name: Test Crédits-baux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  credits-baux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Démarrer le serveur de développement
        run: |
          bun run dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Exécuter le test Crédits-baux (desktop + mobile)
        run: python scripts/test-credits-baux.py --url http://localhost:8080

      - name: Conserver les captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-credits-baux
          path: test-artifacts/credits-baux/
          if-no-files-found: ignore
